<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1><i class="fas fa-calculator"></i> SIP Calculator</h1>
            <p>Plan your investments and estimate returns with this interactive calculator</p>
            
            <div class="form-group">
                <label for="monthly_investment">Monthly Investment (₹)</label>
                <div class="input-group">
                    <span class="input-icon">₹</span>
                    <input type="number" id="monthly_investment" min="500" step="500" value="5000">
                </div>
                <input type="range" id="monthly_investment_range" min="500" max="100000" step="500" value="5000">
            </div>
            
            <div class="form-group">
                <label for="annual_rate">Expected Annual Return (%)</label>
                <div class="input-group">
                    <span class="input-icon">%</span>
                    <input type="number" id="annual_rate" min="1" max="30" step="0.1" value="12">
                </div>
                <input type="range" id="annual_rate_range" min="1" max="30" step="0.1" value="12">
            </div>
            
            <div class="form-group">
                <label for="years">Investment Period (Years)</label>
                <div class="input-group">
                    <span class="input-icon"><i class="far fa-calendar-alt"></i></span>
                    <input type="number" id="years" min="1" max="40" step="1" value="10">
                </div>
                <input type="range" id="years_range" min="1" max="40" step="1" value="10">
            </div>
            
            <button id="calculate-btn">Calculate</button>
            
            <div class="results" id="results">
                <div class="result-card">
                    <h3>Invested Amount</h3>
                    <p id="total_investment">₹0</p>
                </div>
                <div class="result-card">
                    <h3>Estimated Returns</h3>
                    <p id="estimated_returns">₹0</p>
                </div>
                <div class="result-card total">
                    <h3>Total Value</h3>
                    <p id="future_value">₹0</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="sipChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
